name: Deploy Monorepo (Client & Server)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-client:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build --workspace=apps/client

      - name: Verify Client Build
        run: |
          echo "=== Client dist ==="
          ls -la apps/client/dist

          echo "=== index.html ==="
          test -f apps/client/dist/index.html

          echo "=== Assets ==="
          ls -la apps/client/dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Monorepo Dependencies
        run: npm ci
        working-directory: ./

      # --- TAMBAHAN SUPABASE MIGRATION & SEED ---
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Create temporary .env file
        run: |
          touch .env
          echo "DATABASE_URL=postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co:5432/postgres" > .env

      - name: Run Database Seeder
        env:
         DATABASE_URL: ${{ secrets.DATABASE_URL }}
         JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm run seed

      - name: Run Database Seeder
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co:5432/postgres
        run: npm run seed

      # --- DEPLOY CLOUDFLARE ---
      - name: Deploy Server to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: "apps/server"
          command: deploy
          wranglerVersion: "4.131.2"
