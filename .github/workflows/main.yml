name: Deploy Monorepo (Client & Server)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-client:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build --workspace=apps/client

      - name: Verify Client Build
        run: |
          echo "=== Client dist ==="
          ls -la apps/client/dist

          echo "=== index.html ==="
          test -f apps/client/dist/index.html

          echo "=== Assets ==="
          ls -la apps/client/dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Monorepo Dependencies
        run: npm ci
        working-directory: ./

      # --- LANGSUNG DEPLOY CLOUDFLARE ---
      - name: Deploy Server to Cloudflare
        uses: cloudflare/wrangler-action@v3
        env:
          # Pastikan variabel ini tersedia untuk dibaca oleh wrangler-action
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: "apps/server"
          command: deploy
          wranglerVersion: "4.131.2"
          # Beritahu Wrangler untuk menyuntikkan secrets ini ke Cloudflare Workers
          secrets: |
            DATABASE_URL
            JWT_SECRET
