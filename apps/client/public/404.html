<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>School Dashboard</title>
    <script type="text/javascript">
      // Simpan path yang dicoba diakses, lalu lempar balik ke root index.html
      var pathSegmentsToKeep = 1; // 1 karena ada subpath /school-dashboard-starter/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.replace(/^\?/, '') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
